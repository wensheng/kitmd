[package]
name = "kitmd"
version = "0.2.1"
edition = "2024"
description = "A terminal-based markdown and mermaid renderer/viewer using the Kitty graphics protocol"
license = "MIT"
repository = "https://github.com/wensheng/kitmd"
readme = "README.md"
keywords = ["cli", "utility", "markdown", "mermaid"]
categories = ["command-line-utilities"]

[features]
default = []
mermaid_engine_internal_tests = []
png = ["dep:usvg"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
comrak = "0.52"
anyhow = "1.0"
thiserror = "2"
dagre = "0.1.1"
image = "0.25"
resvg = "0.47"
cosmic-text = "0.19"
fontdb = "0.23"
crossterm = "0.29"
atty = "0.2"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "1.3"
once_cell = "1.21"
ttf-parser = "0.25"
base64 = "0.22"
usvg = { version = "0.47", optional = true }
