[package]
name = "kitmd"
version = "0.1.0"
edition = "2024"

[features]
default = []
mermaid_engine_internal_tests = []
png = ["dep:usvg"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
comrak = "0.52"
anyhow = "1.0"
thiserror = "2"
image = "0.25"
resvg = "0.47"
cosmic-text = "0.19"
fontdb = "0.23"
crossterm = "0.29"
atty = "0.2"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "1.3"
once_cell = "1.21"
ttf-parser = "0.25"
base64 = "0.22"
usvg = { version = "0.47", optional = true }
